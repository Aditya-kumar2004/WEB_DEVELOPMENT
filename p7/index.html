
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery">
        <!-- Main display -->
        <div id="mainDisplay"></div>

        <!-- Thumbnails -->
        <div class="thumbnails">
            <div class="thumbnail" data-color="red"></div>
            <div class="thumbnail" data-color="green"></div>
            <div class="thumbnail" data-color="blue"></div>
            <div class="thumbnail" data-color="orange"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
