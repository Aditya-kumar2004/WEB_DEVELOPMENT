<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <div class="todo-container">

        <ul id="taskList">
            <!-- Dynamic tasks load here -->
        </ul>
    </div>

    <script src="index.js"></script>
</body>
</html>
